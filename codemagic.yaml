workflows:
  ios-no-codesign:
    name: iOS (unsigned, for Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - supabase
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Regenerate missing iOS platform files (e.g. Podfile)
        script: |
          # This repo's ios/ folder was scaffolded on Windows, where Flutter
          # skips generating some iOS-only files (like the Podfile) since
          # CocoaPods can't run there anyway. `flutter create` only adds
          # missing files — it won't touch anything already customized.
          flutter create --platforms=ios .
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build unsigned iOS app (device architecture, no signing)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: Package into an unsigned .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r pharco_app-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/pharco_app-unsigned.ipa
