# This machine has only 7GB total RAM — the Flutter-generated default of
# -Xmx8G alone exceeds all physical memory and crashes the Gradle daemon
# with a native OOM. Keep this well under total RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.caching=true
# Kotlin's incremental compiler crashes computing relative paths when the
# project (here, drive E:) and dependency sources (drive C:) are on
# different Windows drive letters. Not relevant for a single clean build.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
